---
layout: default
title: Bible
---

<style>
  .bible-reader-wrap{max-width:900px;margin:0 auto;width:100%}
  .panel{background:#fff;padding:16px;border-radius:12px;border:1px solid #e6eef8;box-sizing:border-box;max-width:100%}
  .row{display:flex;gap:8px;align-items:center;min-width:0}
  .reader-toolbar{flex-wrap:wrap}
  .reader-toolbar > *{min-width:0}
  .reader-toolbar label{flex:0 0 auto}
  .reader-toolbar select{flex:0 0 auto;max-width:100%}
  .reader-toolbar button{flex:0 0 auto}
  select,input{padding:8px;border-radius:8px;border:1px solid #e6eef8;box-sizing:border-box;max-width:100%}
    .books{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
    .book{padding:8px 10px;background:#fff;border:1px solid #eef2ff;border-radius:8px;cursor:pointer}
    .book.active{background:#eef2ff;border-color:#c7d2fe}
    .chapters{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
    .chapter{padding:6px 8px;background:#fff;border:1px solid #eef2ff;border-radius:6px;cursor:pointer}
    .chapter.active{background:#eef2ff;border-color:#c7d2fe}
    .verses{margin-top:12px}
    .verse{padding:8px;border-bottom:1px solid #f1f5f9;font-size:1rem;line-height:1.75}
    .verse strong{display:inline-block;width:2.5rem;color:#475569;font-variant-numeric:tabular-nums;font-size:1rem}
    mark{background:#fff59d}
    @media (max-width: 640px) {
      .bible-reader-wrap{overflow-x:hidden}
      .panel{padding:12px}
      .row{align-items:flex-start}
      .reader-header{flex-direction:column;align-items:flex-start}
      .reader-toolbar{display:grid;grid-template-columns:1fr;gap:10px}
      .reader-toolbar label,
      .reader-toolbar select,
      .reader-toolbar button{width:100%}
    }
</style>

<div class="bible-reader-wrap">
  <div class="panel">
      <div class="row reader-header">
        <h2 style="margin:0">
          <span class="card-en">📖 Bible Reader</span>
          <span class="card-zh">📖 聖經閱讀器</span>
        </h2>
        <div style="margin-left:auto;color:#64748b;font-size:13px">
          <span class="card-en">Read KJV &amp; CUV1919</span>
          <span class="card-zh">閱讀 KJV 與和合本 1919</span>
        </div>
      </div>

      <div style="margin-top:12px" class="row reader-toolbar">
        <label for="version">
          <span class="card-en">Version</span>
          <span class="card-zh">版本</span>
        </label>
        <select id="version">
          <option value="KJV" selected>KJV</option>
          <option value="ESV">ESV (coming soon)</option>
          <option value="CUV">CUV1919</option>
        </select>
      </div>

      <div style="margin-top:12px">
        <label for="book-select" style="display:block;font-size:13px;color:#475569;margin-bottom:6px">
          <span class="card-en">Select Book</span>
          <span class="card-zh">選擇書卷</span>
        </label>
        <select id="book-select" style="width:100%;padding:10px;border-radius:8px;border:1px solid #e6eef8"></select>
      </div>
      <div class="chapters" id="chapters"></div>
      <div class="verses panel" id="verses" style="margin-top:12px;padding:12px"></div>
  </div>

</div>

<script>
  // canonical book order and display names
  const bookOrder = ['genesis','exodus','leviticus','numbers','deuteronomy','joshua','judges','ruth','1-samuel','2-samuel','1-kings','2-kings','1-chronicles','2-chronicles','ezra','nehemiah','esther','job','psalm','proverbs','ecclesiastes','song-of-solomon','isaiah','jeremiah','lamentations','ezekiel','daniel','hosea','joel','amos','obadiah','jonah','micah','nahum','habakkuk','zephaniah','haggai','zechariah','malachi','matthew','mark','luke','john','acts','romans','1-corinthians','2-corinthians','galatians','ephesians','philippians','colossians','1-thessalonians','2-thessalonians','1-timothy','2-timothy','titus','philemon','hebrews','james','1-peter','2-peter','1-john','2-john','3-john','jude','revelation'];
  // short file IDs (must align with bookOrder indices)
  const bookIds = ['gen','ex','lev','num','dut','jos','jdg','rth','1sm','2sm','1ki','2ki','1ch','2ch','ezr','neh','est','job','psa','pro','ecc','sos','isa','jer','lam','eze','dan','hos','joe','amo','oba','jon','mic','nah','hab','zep','hag','zec','mal','mat','mrk','luk','jhn','act','rom','1co','2co','gal','eph','php','col','1th','2th','1ti','2ti','tit','phm','heb','jam','1pe','2pe','1jo','2jo','3jo','jud','rev'];
  const displayNames = bookOrder.map(b=>b.split('-').map(s=>s[0].toUpperCase()+s.slice(1)).join(' '));
  // Traditional Chinese names for CUV1919 (same order as bookOrder)
  const displayNamesZh = ['創世記','出埃及記','利未記','民數記','申命記','約書亞記','士師記','路得記','撒母耳記上','撒母耳記下','列王紀上','列王紀下','歷代志上','歷代志下','以斯拉記','尼希米記','以斯帖記','約伯記','詩篇','箴言','傳道書','雅歌','以賽亞書','耶利米書','耶利米哀歌','以西結書','但以理書','何西阿書','約珥書','阿摩司書','俄巴底亞書','約拿書','彌迦書','那鴻書','哈巴谷書','西番雅書','哈該書','撒迦利亞書','瑪拉基書','馬太福音','馬可福音','路加福音','約翰福音','使徒行傳','羅馬書','哥林多前書','哥林多後書','加拉太書','以弗所書','腓立比書','歌羅西書','帖撒羅尼迦前書','帖撒羅尼迦後書','提摩太前書','提摩太後書','提多書','腓利門書','希伯來書','雅各書','彼得前書','彼得後書','約翰一書','約翰二書','約翰三書','猶大書','啟示錄'];

  const booksEl = document.getElementById('books');
  const chaptersEl = document.getElementById('chapters');
  const versesEl = document.getElementById('verses');
  const versionEl = document.getElementById('version');
  const bookSelectEl = document.getElementById('book-select');
  const siteLangApi = window.Mansli7Lang;
  const STORAGE_KEY = 'mansli7-bible-reader-state';

  let currentBook = null;
  let bookData = null;
  let currentChapter = null;

  function normalizeVersion(value) {
    return value === 'CUV' || value === 'KJV' || value === 'ESV' ? value : null;
  }

  function normalizeBookId(value) {
    if (!value) return null;
    var raw = String(value).trim().toLowerCase();
    var idx = bookIds.indexOf(raw);
    if (idx >= 0) return bookIds[idx];
    idx = bookOrder.indexOf(raw);
    return idx >= 0 ? bookIds[idx] : null;
  }

  function normalizeChapter(value) {
    var chapter = parseInt(value, 10);
    return Number.isFinite(chapter) && chapter > 0 ? chapter : null;
  }

  function loadStoredState() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (error) {
      return {};
    }
  }

  function saveReaderState() {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify({
        version: versionEl.value || 'KJV',
        book: currentBook || bookSelectEl.value || 'gen',
        chapter: currentChapter || null
      }));
    } catch (error) {
      // ignore storage failures
    }
  }

  function syncUrlState() {
    if (!window.history || !window.history.replaceState) return;
    var params = new URLSearchParams();
    params.set('version', versionEl.value || 'KJV');
    params.set('book', currentBook || bookSelectEl.value || 'gen');
    if (currentChapter) params.set('chapter', String(currentChapter));
    window.history.replaceState(null, '', '/bible/?' + params.toString());
  }

  function getInitialState() {
    var params = new URLSearchParams(window.location.search || '');
    var stored = loadStoredState();
    var siteDefaultVersion = getCurrentSiteLang() === 'zh' ? 'CUV' : 'KJV';
    return {
      version: normalizeVersion(params.get('version')) || normalizeVersion(stored.version) || siteDefaultVersion,
      book: normalizeBookId(params.get('book')) || normalizeBookId(stored.book) || 'gen',
      chapter: normalizeChapter(params.get('chapter')) || normalizeChapter(stored.chapter)
    };
  }

  function getCurrentSiteLang() {
    return siteLangApi && siteLangApi.getCurrentLang ? siteLangApi.getCurrentLang() : 'en';
  }

  function updateUiText() {
    const currentLang = getCurrentSiteLang();
    const esvOption = versionEl.querySelector('option[value="ESV"]');
    if (esvOption) esvOption.textContent = currentLang === 'zh' ? 'ESV（即將推出）' : 'ESV (coming soon)';
  }

  function populateBookSelect(preferredBookId){
    const currentLang = getCurrentSiteLang();
    const preferred = preferredBookId || bookSelectEl.value || currentBook;
    bookSelectEl.innerHTML = '';
    const ntIndex = bookOrder.indexOf('matthew');
    const otGroup = document.createElement('optgroup'); otGroup.label = currentLang === 'zh' ? '舊約' : 'Old Testament';
    const ntGroup = document.createElement('optgroup'); ntGroup.label = currentLang === 'zh' ? '新約' : 'New Testament';
    for(let i=0;i<bookOrder.length;i++){
      const id = bookIds[i];
      const name = (versionEl.value === 'CUV' ? displayNamesZh[i] : displayNames[i]);
      const opt = document.createElement('option'); opt.value = id; opt.textContent = name;
      if (id === preferred) opt.selected = true;
      if(i < ntIndex) otGroup.appendChild(opt); else ntGroup.appendChild(opt);
    }
    if(otGroup.children.length) bookSelectEl.appendChild(otGroup);
    if(ntGroup.children.length) bookSelectEl.appendChild(ntGroup);
    if (!bookSelectEl.value) {
      const firstOption = bookSelectEl.querySelector('option');
      if (firstOption) firstOption.selected = true;
    }
    bookSelectEl.onchange = ()=>{ const v = bookSelectEl.value; if(v) loadBook(v); };
  }

  // Update book labels when version changes
  versionEl.addEventListener('change', ()=> {
    populateBookSelect(currentBook);
    const selectedBook = bookSelectEl.value || currentBook;
    if (selectedBook) loadBook(selectedBook, currentChapter);
  });

  async function loadBook(bookId, chapterToOpen){
    currentBook = bookId;
    const ver = versionEl.value || 'KJV';
    const lang = (ver === 'CUV') ? 'zh' : 'en';
    const url = `/data/bible/${lang}/${ver}/${bookId}.json`;
    try{
      const res = await fetch(url);
      if(!res.ok) throw new Error('Not found');
      const data = await res.json();
        // normalize shapes: support {verses: [...]} or array directly
        let arr = null;
        if(Array.isArray(data)) arr = data;
        else if(data && Array.isArray(data.verses)) arr = data.verses;
        else if(data && Array.isArray(data.v)) arr = data.v;
        else arr = [];
        // attach book metadata and text_norm for searching/display
        const bookName = (data && data.book) ? data.book : bookId;
        const bookIdMeta = (data && data.book_id) ? data.book_id : bookId;
        for(const v of arr){ if(v && typeof v === 'object'){ v.book = v.book || bookName; v.book_id = v.book_id || bookIdMeta; v.text_norm = v.text_norm || (v.text ? v.text.toLowerCase() : ''); } }
        bookData = arr;
      bookSelectEl.value = bookId;
      saveReaderState();
      // highlight active book
      document.querySelectorAll('.book').forEach(el=>el.classList.toggle('active', el.dataset.book===bookId));
      const chapters = renderChapters();
      var chapterToRender = chapters.length ? chapters[0] : null;
      if (chapterToOpen !== null && chapterToOpen !== undefined) {
        var normalizedRequested = normalizeChapter(chapterToOpen);
        if (normalizedRequested !== null && chapters.indexOf(normalizedRequested) !== -1) {
          chapterToRender = normalizedRequested;
        }
      }
      if (chapterToRender !== null) renderChapter(chapterToRender);
    }catch(e){ versesEl.innerHTML = `<div style="color:#dc2626">${getCurrentSiteLang() === 'zh' ? '無法載入' : 'Failed to load'} ${bookId} (${e.message})</div>`; }
  }

  function renderChapters(){
    chaptersEl.innerHTML='';
    if(!bookData) return [];
    // group verses by chapter
    const chapters = {};
    for(const v of bookData){ chapters[v.chapter] = (chapters[v.chapter]||0)+1; }
    const sortedChapters = Object.keys(chapters).map(function(ch){ return parseInt(ch, 10); }).sort((a,b)=>a-b);
    for(const ch of sortedChapters){
      const el = document.createElement('div'); el.className='chapter'; el.textContent = ch; el.dataset.ch = ch;
      el.onclick = ()=> renderChapter(parseInt(ch,10));
      chaptersEl.appendChild(el);
    }
    return sortedChapters;
  }

  function getBookDisplayName(bookId){
    // bookId is short id from bookIds; map back to index
    const idx = bookIds.indexOf(bookId);
    if(idx<0){
      const f = bookOrder.indexOf(bookId);
      if(f>=0) return (versionEl.value === 'CUV' ? displayNamesZh[f] : displayNames[f]);
      return bookId;
    }
    return (versionEl.value === 'CUV' ? displayNamesZh[idx] : displayNames[idx]);
  }

  function renderChapter(ch){
    if(!bookData) return;
    currentChapter = normalizeChapter(ch);
    const verses = bookData.filter(v=>v.chapter===ch);
    versesEl.innerHTML = '';
    for(const v of verses){
      const d = document.createElement('div'); d.className='verse';
      d.innerHTML = `<strong>${v.verse}</strong> <span>${escapeHtml(v.text)}</span>`;
      versesEl.appendChild(d);
    }
    // mark active chapter
    document.querySelectorAll('.chapter').forEach(el=>el.classList.toggle('active', el.dataset.ch==ch));
    saveReaderState();
    syncUrlState();
  }

  function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // initial render
  const initialState = getInitialState();
  versionEl.value = initialState.version;
  updateUiText();
  populateBookSelect(initialState.book);
  if (bookSelectEl.value) loadBook(bookSelectEl.value, initialState.chapter);
  document.addEventListener('mansli7:langchange', function() {
    updateUiText();
    populateBookSelect(currentBook);
  });
</script>
