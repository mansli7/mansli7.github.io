theme: jekyll-theme-cayman
title: Mansli7 Portal
description: Bible Study and Technology Sharing
author: Mansli7
title_separator: "|"
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Folders/files used for local workflows only; not part of the published site.
# Note: setting `exclude` overrides Jekyll's defaults, so build/dependency
# paths (node_modules etc.) must be listed explicitly here.
exclude:
  - doc/
  - tmp/
  - tools/
  - node_modules/
  - src/
  - package.json
  - package-lock.json
  - tailwind.config.js