<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function() {
      var lang = 'en';
      try {
        lang = window.localStorage.getItem('mansli7-site-lang') || 'en';
      } catch (error) {
        lang = 'en';
      }
      if (lang !== 'zh') lang = 'en';
      document.documentElement.setAttribute('data-site-lang', lang);
      document.documentElement.setAttribute('lang', lang === 'zh' ? 'zh-Hant' : 'en');
    })();
  </script>
  {% seo %}

  <style>
    .card-zh { display: none; }
    html[data-site-lang="zh"] .card-en { display: none !important; }
    html[data-site-lang="zh"] .card-zh { display: block !important; }
    html[data-site-lang="zh"] span.card-zh,
    html[data-site-lang="zh"] strong.card-zh,
    html[data-site-lang="zh"] em.card-zh,
    html[data-site-lang="zh"] small.card-zh {
      display: inline !important;
    }
    html[data-site-lang="zh"] a.card-zh,
    html[data-site-lang="zh"] button.card-zh { display: inline-block !important; }
    html[data-site-lang="zh"] .inline-block.card-zh { display: inline-block !important; }
    html[data-site-lang="zh"] .inline-flex.card-zh { display: inline-flex !important; }
    html[data-site-lang="zh"] .flex.card-zh { display: flex !important; }
    html[data-site-lang="zh"] .grid.card-zh { display: grid !important; }
    html[data-site-lang="en"] .card-zh { display: none !important; }
    .lang-switch-active {
      background: #1e293b !important;
      border-color: #1e293b !important;
      color: #ffffff !important;
    }
  </style>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script>
    tailwind.config = {
      corePlugins: { preflight: false },
      theme: {
        extend: {
          colors: { primary: '#6366f1', 'primary-dark': '#4f46e5' },
          fontFamily: {
            sans: ['Inter','system-ui','-apple-system','Segoe UI','Roboto',
                   'Helvetica Neue','Arial','PingFang TC','Hiragino Sans GB',
                   'Microsoft YaHei New','Microsoft Yahei','SimHei','sans-serif']
          }
        }
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Site styles -->
  <link rel="stylesheet" href="/assets/css/style.css?v=2026-03-18">
  <script src="/assets/js/reading-plan-2026.js?v=2026-03-19"></script>
  <script src="/assets/js/site-lang.js?v=2026-03-18"></script>
</head>
<body>

  {% include nav.html %}

  <main class="py-8">
    <div class="container max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
      {{ content }}
    </div>
  </main>

  <script>
    // Mobile menu toggle
    const navToggle = document.getElementById('navToggle');
    const mobileMenu = document.getElementById('mobileMenu');
    const menuIcon = document.getElementById('menuIcon');
    const closeIcon = document.getElementById('closeIcon');

    if (navToggle && mobileMenu) {
      navToggle.addEventListener('click', function() {
        const isOpen = !mobileMenu.classList.contains('hidden');
        mobileMenu.classList.toggle('hidden');
        if (menuIcon) menuIcon.classList.toggle('hidden', !isOpen);
        if (closeIcon) closeIcon.classList.toggle('hidden', isOpen);
        this.setAttribute('aria-expanded', String(!isOpen));
      });
    }

    // Mobile reading plan dropdown toggle
    const mobileDropToggle = document.getElementById('mobileDropToggle');
    const mobileDropContent = document.getElementById('mobileDropContent');
    if (mobileDropToggle && mobileDropContent) {
      mobileDropToggle.addEventListener('click', function() {
        const isOpen = !mobileDropContent.classList.contains('hidden');
        mobileDropContent.classList.toggle('hidden');
        this.setAttribute('aria-expanded', String(!isOpen));
      });
    }

    // Highlight active page
    const currentPath = window.location.pathname;
    document.querySelectorAll('.nav-link').forEach(function(link) {
      const href = link.getAttribute('href');
      if (href && (href === currentPath || (href !== '/' && currentPath.startsWith(href)))) {
        link.classList.add('active');
      }
    });

    // Close mobile menu when clicking outside
    document.addEventListener('click', function(e) {
      if (mobileMenu && navToggle && !mobileMenu.classList.contains('hidden')) {
        if (!mobileMenu.contains(e.target) && !navToggle.contains(e.target)) {
          mobileMenu.classList.add('hidden');
          if (menuIcon) menuIcon.classList.remove('hidden');
          if (closeIcon) closeIcon.classList.add('hidden');
          navToggle.setAttribute('aria-expanded', 'false');
        }
      }
    });

    // Annual Reading: clean cell display, link to study questions, highlight today
    (function() {
      if (!/\/bs\/ar\/2026-/.test(window.location.pathname)) return;
      var isZh = /2026-zh/.test(window.location.pathname);
      var sqBase = '/bs/sq/' + (isZh ? 'zh' : 'en') + '/';

      // Books that have study questions (longer keys first to avoid partial matches)
      var bookMap = isZh
        ? { '撒上':'1-samuel','撒下':'2-samuel','王上':'1-kings','王下':'2-kings',
            '創':'genesis','出':'exodus','利':'leviticus','民':'numbers',
            '申':'deuteronomy','書':'joshua','士':'judges','得':'ruth' }
        : { '1Sa':'1-samuel','2Sa':'2-samuel','1Ki':'1-kings','2Ki':'2-kings',
            'Ge':'genesis','Ex':'exodus','Lev':'leviticus','Nu':'numbers',
            'Dt':'deuteronomy','Jos':'joshua','Jdg':'judges','Ru':'ruth' };
      var bookKeys = Object.keys(bookMap);

      var now = new Date();
      var todayM = now.getMonth() + 1;
      var todayD = now.getDate();
      var todayCell = null;

      document.querySelectorAll('table td').forEach(function(cell) {
        var text = cell.textContent.trim();
        var parts = text.match(/^(\d+),(\d+),(.+)$/);
        if (!parts) return;

        var cm = parseInt(parts[1]), cd = parseInt(parts[2]), reading = parts[3];
        var isToday = (cm === todayM && cd === todayD);
        if (isToday) todayCell = cell;

        // Find study question slug (try keys in order)
        var slug = null;
        for (var k = 0; k < bookKeys.length; k++) {
          if (reading.indexOf(bookKeys[k]) === 0) { slug = bookMap[bookKeys[k]]; break; }
        }

        // Rewrite cell: keep M,D, prefix as plain text, link only the reading part
        cell.textContent = '';
        cell.appendChild(document.createTextNode(cm + ',' + cd + ','));
        if (slug) {
          var a = document.createElement('a');
          a.href = sqBase + slug;
          a.textContent = reading;
          a.title = isZh ? '查看學習問題' : 'View study questions';
          a.style.cssText = 'color:inherit;text-decoration:underline;text-decoration-style:dotted;';
          cell.appendChild(a);
        } else {
          cell.appendChild(document.createTextNode(reading));
        }

        // Highlight today
        if (isToday) {
          cell.style.background = 'linear-gradient(135deg, #f5c842, #f0a500)';
          cell.style.color = '#2c1810';
          cell.style.fontWeight = '700';
          cell.style.borderRadius = '6px';
          cell.style.outline = '2px solid #f0a500';
          if (slug) cell.querySelector('a').style.color = '#2c1810';
          var row = cell.parentElement;
          if (row) row.querySelectorAll('td').forEach(function(sib) {
            if (sib !== cell) sib.style.background = 'rgba(245,200,66,0.15)';
          });
        }
      });

      if (todayCell) setTimeout(function() {
        todayCell.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 200);
    })();

    // Study Questions: inject download button on individual book pages
    (function() {
      var sqMatch = window.location.pathname.match(/\/bs\/sq\/(en|zh)\/([^/]+)/);
      if (!sqMatch) return;
      var lang = sqMatch[1];
      var book = sqMatch[2].replace(/\/$/, '');

      var container = document.querySelector('main .container');
      if (!container) return;
      var firstDiv = container.querySelector('div');
      if (!firstDiv) return;

      firstDiv.classList.add('sq-book-actions');

      function normalizeRange(rangeText) {
        return rangeText
          .replace(/[—–]/g, '-')
          .replace(/\s+/g, '')
          .replace(/[^0-9-]/g, '')
          .replace(/-+/g, '-')
          .replace(/^-|-$/g, '');
      }

      function extractRange(text) {
        var match = text.match(/(\d+(?:\s*[—–-]\s*\d+)*)\s*$/);
        return match ? normalizeRange(match[1]) : '';
      }

      function enhanceStudyQuestionPage() {
        var children = Array.from(container.children);
        var pastFirstDiv = false;

        for (var i = 0; i < children.length; i++) {
          var node = children[i];
          if (node === firstDiv) {
            pastFirstDiv = true;
            continue;
          }
          if (!pastFirstDiv) continue;

          var tag = node.tagName.toLowerCase();
          if (tag === 'hr') {
            node.classList.add('sq-divider');
            continue;
          }

          if (tag !== 'p') continue;

          var content = node.textContent.trim();
          if (!content) continue;
          if (/^[←]/.test(content)) {
            node.classList.add('sq-backlink');
            continue;
          }

          var range = extractRange(content);
          if (range) {
            var heading = document.createElement('h2');
            heading.id = 'sq-' + book + '-' + range;
            heading.className = 'sq-unit-heading';
            heading.textContent = content;
            node.parentNode.replaceChild(heading, node);

            if (heading.previousElementSibling && heading.previousElementSibling.tagName.toLowerCase() === 'hr') {
              heading.previousElementSibling.classList.add('sq-divider-hidden');
            }
            if (heading.nextElementSibling && heading.nextElementSibling.tagName.toLowerCase() === 'hr') {
              heading.nextElementSibling.classList.add('sq-divider-hidden');
            }
            continue;
          }

          node.classList.add('sq-question');
        }

        if (window.location.hash) {
          var target = document.getElementById(window.location.hash.slice(1));
          if (target) {
            setTimeout(function() {
              target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 60);
          }
        }
      }

      enhanceStudyQuestionPage();

      var dlBtn = document.createElement('a');
      dlBtn.className = 'cta-outline';
      dlBtn.href = '#';
      dlBtn.textContent = lang === 'zh' ? '⬇️ 下載文字檔' : '⬇️ Download TXT';

      dlBtn.addEventListener('click', function(e) {
        e.preventDefault();

        var title = document.title;
        var text = title + '\n' + Array(title.length + 1).join('=') + '\n\n';

        var pastFirstDiv = false;
        var nodes = Array.from(container.childNodes);
        for (var i = 0; i < nodes.length; i++) {
          var node = nodes[i];
          if (node.nodeType !== 1) continue;
          var tag = node.tagName.toLowerCase();

          // Skip the first div (nav buttons)
          if (tag === 'div' && !pastFirstDiv) {
            pastFirstDiv = true;
            continue;
          }

          if (tag === 'hr') {
            text += '\n';
          } else if (tag === 'h1') {
            // Title already in header
          } else if (tag === 'h2') {
            text += node.textContent.trim() + '\n\n';
          } else if (tag === 'p') {
            var content = node.textContent.trim();
            // Skip back-navigation paragraphs
            if (content && !/^[←]/.test(content)) {
              text += content + '\n\n';
            }
          } else {
            var other = node.textContent.trim();
            if (other && !/^[←]/.test(other)) {
              text += other + '\n\n';
            }
          }
        }

        var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'study-questions-' + book + '-' + lang + '.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });

      firstDiv.appendChild(dlBtn);
    })();
  </script>

  <script>
  // Homepage: Today's Reading widget
  (function(){
    if (window.location.pathname !== '/') return;
    var readingPlan = window.Mansli7Reading2026;
    var langApi = window.Mansli7Lang;
    if (!readingPlan) return;
    var r = readingPlan.r;
    var parse = readingPlan.parse;
    var exactSqHref = readingPlan.exactSqHref;
    var now = new Date();
    var key = (now.getMonth() + 1) + '/' + now.getDate();
    var code = r[key];
    var elDate = document.getElementById('todayDate');
    var elRef = document.getElementById('todayRef');
    var elRefZh = document.getElementById('todayRefZh');
    var elNote = document.getElementById('todayNote');
    var elActions = document.getElementById('todayActions');

    function renderWidget() {
      var currentLang = langApi && langApi.getCurrentLang ? langApi.getCurrentLang() : 'en';
      if (!elDate || !elActions || !elRef || !elRefZh) return;

      elActions.textContent = '';
      if (elNote) elNote.textContent = '';
      // Show weekday plus year, month and day
      elDate.textContent = currentLang === 'zh'
        ? new Intl.DateTimeFormat('zh-Hant', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }).format(now)
        : new Intl.DateTimeFormat('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }).format(now);

      if (!code) {
        elRef.textContent = 'No reading scheduled for today';
        elRefZh.textContent = '今天沒有安排讀經。';
        return;
      }

      var parsed = parse(code);
      // Combine passage and question label on one line
      elRef.textContent = parsed.en + ' — Study Questions';
      elRefZh.textContent = parsed.zh + ' 思考問題';

      // Bible link (language-specific version)
      (function(){
        try {
          var bibleHref = null;
          if (parsed.abbr) {
            // Use shared bgUrl builder so book names are converted and encoded correctly
            bibleHref = readingPlan.bgUrl(parsed.abbr, parsed.chapters, currentLang === 'zh' ? 'CUV' : 'NIV', currentLang === 'zh' ? 'zh' : 'en');
          } else if (parsed.bg) {
            bibleHref = parsed.bg;
          }
          if (bibleHref) {
            var bibleBtn = document.createElement('a');
            bibleBtn.href = bibleHref;
            bibleBtn.target = '_blank';
            bibleBtn.rel = 'noopener noreferrer';
            bibleBtn.className = 'cta';
            bibleBtn.textContent = currentLang === 'zh' ? '📖 打開 BibleGateway 讀經' : '📖 Open BibleGateway to read';
            elActions.appendChild(bibleBtn);
          }
        } catch (e) {
          // fail silently
        }
      })();

      // Show study-question prompts inline (if available). No extra SQ button.
      if (parsed.sqStatus && parsed.sqStatus.available) {
        var hq = window.Mansli7Reading2026 && window.Mansli7Reading2026.hq ? window.Mansli7Reading2026.hq : {};
        var prompts = hq && hq[code] ? (currentLang === 'zh' ? hq[code].zh : hq[code].en) : null;
        if (elNote) {
          if (prompts && prompts.length) {
            var noteHtml = '';
            noteHtml += '<ul class="text-sm text-slate-600 mb-3" style="padding-left:1rem;margin:0;">';
            for (var i = 0; i < prompts.length; i++) {
              noteHtml += '<li style="margin-bottom:0.35rem;">' + prompts[i] + '</li>';
            }
            noteHtml += '</ul>';
            // don't add the "open full page" link per request
            elNote.innerHTML = noteHtml;
          } else {
            elNote.textContent = currentLang === 'zh'
              ? '今日有對應學習問題。'
              : 'Study question available for today.';
          }
        }
      } else if (parsed.en === '📋 Review Day') {
        if (elNote) {
          elNote.textContent = currentLang === 'zh'
            ? '複習日：可回顧本週進度與現有問題集。'
            : 'Review day: revisit this week\'s readings and any available question sets.';
        }
      } else {
        if (elNote) {
          elNote.textContent = currentLang === 'zh'
            ? '今日尚無學習問題。'
            : 'No study question available for today.';
        }
      }
    }

    renderWidget();
    document.addEventListener('mansli7:langchange', renderWidget);
  })();
  </script>

</body>
</html>
