<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>{{ page.title }}</title>

  <!-- Google Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Site styles -->
  <link rel="stylesheet" href="/assets/css/style.css?v=2026-03-09b">
</head>
<body>

  {% include nav.html %}

  <main class="section">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <script>
    // Mobile menu toggle
    const navToggle = document.getElementById('navToggle');
    const navMenu = document.getElementById('navMenu');
    
    if (navToggle) {
      navToggle.addEventListener('click', function() {
        this.classList.toggle('active');
        navMenu.classList.toggle('active');
      });
    }
    
    // Mobile dropdown toggle
    const dropdowns = document.querySelectorAll('.dropdown');
    dropdowns.forEach(dropdown => {
      const link = dropdown.querySelector('a');
      if (link && window.innerWidth <= 768) {
        link.addEventListener('click', function(e) {
          if (this.nextElementSibling && this.nextElementSibling.classList.contains('dropdown-content')) {
            e.preventDefault();
            dropdown.classList.toggle('active');
          }
        });
      }
    });
    
    // Highlight active page
    const currentPath = window.location.pathname;
    const navLinks = document.querySelectorAll('.nav-link, .dropdown > a');
    
    navLinks.forEach(link => {
      const href = link.getAttribute('href');
      if (href === currentPath || (href !== '/' && currentPath.startsWith(href))) {
        link.classList.add('active');
      }
    });
    
    // Close mobile menu when clicking outside
    document.addEventListener('click', function(e) {
      if (navMenu && navToggle) {
        if (!navMenu.contains(e.target) && !navToggle.contains(e.target)) {
          navMenu.classList.remove('active');
          navToggle.classList.remove('active');
        }
      }
    });

    // Annual Reading: highlight today's cell
    (function() {
      if (!/\/bs\/ar\/2026-/.test(window.location.pathname)) return;
      var now = new Date();
      var m = now.getMonth() + 1;
      var d = now.getDate();
      var prefix = m + ',' + d + ',';
      var cells = document.querySelectorAll('table td');
      for (var i = 0; i < cells.length; i++) {
        var cell = cells[i];
        if (cell.textContent.trim().indexOf(prefix) === 0) {
          cell.style.background = 'linear-gradient(135deg, #f5c842, #f0a500)';
          cell.style.color = '#2c1810';
          cell.style.fontWeight = '700';
          cell.style.borderRadius = '6px';
          cell.style.outline = '2px solid #f0a500';
          // Also highlight the whole row lightly
          var row = cell.parentElement;
          if (row) {
            var siblings = row.querySelectorAll('td');
            for (var j = 0; j < siblings.length; j++) {
              if (siblings[j] !== cell) {
                siblings[j].style.background = 'rgba(245, 200, 66, 0.15)';
              }
            }
          }
          setTimeout(function() {
            cell.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 200);
          break;
        }
      }
    })();

    // Study Questions: inject download button on individual book pages
    (function() {
      var sqMatch = window.location.pathname.match(/\/bs\/sq\/(en|zh)\/([^/]+)/);
      if (!sqMatch) return;
      var lang = sqMatch[1];
      var book = sqMatch[2].replace(/\/$/, '');

      var container = document.querySelector('main .container');
      if (!container) return;
      var firstDiv = container.querySelector('div');
      if (!firstDiv) return;

      var dlBtn = document.createElement('a');
      dlBtn.className = 'cta';
      dlBtn.style.marginLeft = '1rem';
      dlBtn.href = '#';
      dlBtn.innerHTML = '⬇️ Download';

      dlBtn.addEventListener('click', function(e) {
        e.preventDefault();

        var title = document.title;
        var text = title + '\n' + Array(title.length + 1).join('=') + '\n\n';

        var pastFirstDiv = false;
        var nodes = Array.from(container.childNodes);
        for (var i = 0; i < nodes.length; i++) {
          var node = nodes[i];
          if (node.nodeType !== 1) continue;
          var tag = node.tagName.toLowerCase();

          // Skip the first div (nav buttons)
          if (tag === 'div' && !pastFirstDiv) {
            pastFirstDiv = true;
            continue;
          }

          if (tag === 'hr') {
            text += '\n';
          } else if (tag === 'h1') {
            // Title already in header
          } else if (tag === 'p') {
            var content = node.textContent.trim();
            // Skip back-navigation paragraphs
            if (content && !/^[←]/.test(content)) {
              text += content + '\n\n';
            }
          } else {
            var other = node.textContent.trim();
            if (other && !/^[←]/.test(other)) {
              text += other + '\n\n';
            }
          }
        }

        var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'study-questions-' + book + '-' + lang + '.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });

      firstDiv.appendChild(dlBtn);
    })();
  </script>

</body>
</html>
