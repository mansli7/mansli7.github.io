<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Test Bible Search</title>
  <style>body{font-family:system-ui,Segoe UI,Arial;margin:20px} #results{margin-top:10px} .verse{padding:6px;border-bottom:1px solid #eee}</style>
  <script src="/assets/js/search-engine.js"></script>
</head>
<body>
  <h2>Test Bible Search (KJV)</h2>
  <input id="q" style="width:60%" placeholder='query: e.g. "in the beginning" or faith & hope or /love/'>
  <button id="run">Search</button>
  <div id="results"></div>
  <div id="pager" style="margin-top:10px"></div>

  <script>
    const version = 'KJV';
    const pageSize = 20;
    let currentResults = [];
    let page = 0;

    function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    function renderPage(){
      const out = document.getElementById('results');
      out.innerHTML = `<div>Found ${currentResults.length} results</div>`;
      const start = page * pageSize;
      const slice = currentResults.slice(start, start+pageSize);
      // prepare highlight patterns from currentQuery
      const hl = [];
      try{
        const q = currentQuery || '';
        // extract quoted phrases
        const phraseMatches = q.match(/"([^"]+)"/g) || [];
        for(const p of phraseMatches){ hl.push(escapeRegExp(p.replace(/"/g,''))); }
        // extract regexes
        const regexMatches = q.match(/\/(.+?)\//g) || [];
        for(const r of regexMatches){ hl.push(r.slice(1,-1)); }
        // remaining words
        const words = q.replace(/"[^"]+"/g,'').replace(/\/.+?\//g,'').split(/\s+/).filter(Boolean);
        for(const w of words){ if(/^[&|~()]+$/.test(w)) continue; hl.push('\\b'+escapeRegExp(w)+'\\b'); }
      }catch(e){ /* ignore */ }

      const highlightRegex = hl.length ? new RegExp('(' + hl.join('|') + ')', 'ig') : null;

      for(const v of slice){
        const el = document.createElement('div'); el.className='verse';
        let text = escapeHtml(v.text);
        if(highlightRegex) text = text.replace(highlightRegex, '<mark>$1</mark>');
        el.innerHTML = `<strong>${v.book} ${v.chapter}:${v.verse}</strong> — ${text}`;
        out.appendChild(el);
      }
      const pager = document.getElementById('pager');
      const totalPages = Math.ceil(currentResults.length / pageSize);
      pager.innerHTML = '';
      if(totalPages>1){
        const prev = document.createElement('button'); prev.textContent='Prev'; prev.disabled = page===0;
        prev.onclick = ()=>{ if(page>0){ page--; renderPage(); } };
        const next = document.createElement('button'); next.textContent='Next'; next.disabled = page+1>=totalPages;
        next.onclick = ()=>{ if(page+1<totalPages){ page++; renderPage(); } };
        const info = document.createElement('span'); info.style.margin='0 8px'; info.textContent = `Page ${page+1}/${totalPages}`;
        pager.appendChild(prev); pager.appendChild(info); pager.appendChild(next);
      }
    }

    document.getElementById('run').addEventListener('click', async ()=>{
      const q = document.getElementById('q').value.trim();
      if(!q) return;
      page = 0;
      currentResults = await SearchEngine.search(q, version);
      renderPage();
    });
  </script>
</body>
</html>
